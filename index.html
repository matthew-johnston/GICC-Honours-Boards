<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Green Island Cricket Club - Honours Board</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Great+Vibes&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="fullscreen-board" id="honours-board">
    
    <!-- Outer Inset Gold Pin-stripe Framing Border (matching reference photo) -->
    <div class="board-frame-border" aria-hidden="true"></div>

    <!-- Centered Straight Gold Header (matching reference photo 1) -->
    <header class="board-header">
      <h1 class="club-title">GREEN ISLAND CRICKET CLUB</h1>
      <div class="header-gold-divider" aria-hidden="true">
        <span class="divider-diamond">◆</span>
      </div>
      <div class="subline-wrapper">
        <h2 class="board-subline-title" id="board-category-title">PRESIDENTS</h2>
        <span class="page-indicator-pill" id="board-page-pill" style="display: none;">PAGE 1 OF 1</span>
      </div>
    </header>

    <!-- Dynamic Honours Board Stage (cross-faded every 15s) -->
    <main class="board-stage" id="board-stage" aria-live="polite">
      <!-- Populated dynamically by js/board.js and js/app.js -->
    </main>

    <!-- Bottom Inscription & Status Bar -->
    <footer class="board-footer">
      <div class="footer-left">
        <span class="sync-dot" id="sync-status" title="Google Sheet connected"></span>
        <span class="pause-badge" id="pause-badge" aria-hidden="true">PAUSED</span>
        <span class="footer-category" id="footer-category-title">PRESIDENTS</span>
      </div>

      <div class="footer-center">
        <span class="board-counter" id="footer-board-counter">BOARD 1 OF 11</span>
        <div class="progress-track" title="15-second rotation timer">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>

      <div class="footer-right">
        <!-- Physical board bottom inscription -->
        <span class="donated-by">DONATED BY.. Ladies Committee...</span>
      </div>
    </footer>

    <!-- Discreet TV Navigation Controls -->
    <nav class="tv-controls" aria-label="Board Navigation">
      <button type="button" class="nav-btn nav-arrow" id="prev-btn" title="Previous Board (Left Arrow)">‹</button>
      <button type="button" class="nav-btn" id="pause-btn" title="Pause / Resume (Space)">❚❚</button>
      <button type="button" class="nav-btn nav-arrow" id="next-btn" title="Next Board (Right Arrow)">›</button>
    </nav>

  </div>

  <!-- Application Scripts -->
  <script src="js/config.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/board.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
